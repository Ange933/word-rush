services:
  postgres:
    image: postgres:16-alpine
    container_name: wordrush_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wordrush
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wordrush2024
    ports:
      - "5432:5432"
    volumes:
      - ./docs/database/word_rush_mld.sql:/docker-entrypoint-initdb.d/init.sql
      - wordrush_data:/var/lib/postgresql/data

volumes:
  wordrush_data:
